name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation where you needed this.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
      description: Your proposed feature or workflow.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Clipping / rendering
        - Captions / styles
        - Speech / transcription
        - Projects / storage
        - Settings / appearance
        - Shortcuts / UX
        - Something else
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered (optional)
